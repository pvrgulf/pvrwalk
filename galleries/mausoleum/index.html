<!doctype html>
<!-- CAMBO-WALKS-GENERATED-GALLERY -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>The Mausoleum — Cambo Walks</title>

    <link rel="stylesheet" href="../gallery.css">
    <link rel="stylesheet" href="../../assets/css/lightbox.css">
</head>

<body>

    <main class="gallery-page">

        <header class="gallery-header">

            <h1>The Mausoleum</h1>

            <a href="../index.html" class="gallery-back" id="gallery-back">
                Back to Galleries
            </a>

        </header>

        <p class="gallery-description">Built in 1821 as the Erskine family burial chamber. Access may be unavailable during special events</p>

        <section class="photo-grid">

            
        <a class="gallery-photo zoom"
           href="Mausoleum-1.jpg"
           data-gallery="mausoleum"
           data-caption="Mausoleum 1">

            <img src="thumbnails/Mausoleum-1.jpg"
                 alt="Mausoleum 1"
                 loading="lazy">

            <span class="photo-caption">Mausoleum 1</span>

        </a>
        
        <a class="gallery-photo zoom"
           href="Mausoleum-2.jpg"
           data-gallery="mausoleum"
           data-caption="Mausoleum 2">

            <img src="thumbnails/Mausoleum-2.jpg"
                 alt="Mausoleum 2"
                 loading="lazy">

            <span class="photo-caption">Mausoleum 2</span>

        </a>
        

        </section>

    </main>

    <script src="../../assets/js/lightbox.js"></script>
    <script>
        (function () {
            const backLink = document.getElementById("gallery-back");
            const params = new URLSearchParams(window.location.search);
            const returnTo = params.get("returnTo");
            if (!backLink || !returnTo) return;

            try {
                const target = new URL(returnTo, window.location.href);
                const current = new URL(window.location.href);
                // Only allow return destinations on the same site/protocol.
                if (target.protocol === current.protocol && target.host === current.host) {
                    backLink.href = target.href;
                    backLink.textContent = "← Back to walk";
                }
            } catch (error) {
                // Keep the default All galleries destination if the parameter is invalid.
            }
        })();
    </script>


</body>
</html>
