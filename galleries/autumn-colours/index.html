<!doctype html>
<!-- CAMBO-WALKS-GENERATED-GALLERY -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Autumn Colours — Cambo Walks</title>

    <link rel="stylesheet" href="../gallery.css">
    <link rel="stylesheet" href="../../assets/css/lightbox.css">
</head>

<body>

    <main class="gallery-page">

        <header class="gallery-header">

            <h1>Autumn Colours</h1>

            <a href="../index.html" class="gallery-back" id="gallery-back">
                Back to Galleries
            </a>

        </header>

        <p class="gallery-description">Photographs of flowers, shrubs and plants in Cambo Gardens during Autumn.</p>

        <section class="photo-grid">

            
        <a class="gallery-photo zoom"
           href="autumn%20colours-01.jpeg"
           data-gallery="autumn-colours"
           data-caption="Autumn colours 01">

            <img src="thumbnails/autumn%20colours-01.jpeg"
                 alt="Autumn colours 01"
                 loading="lazy">

            <span class="photo-caption">Autumn colours 01</span>

        </a>
        
        <a class="gallery-photo zoom"
           href="autumn%20colours-02.jpeg"
           data-gallery="autumn-colours"
           data-caption="Autumn colours 02">

            <img src="thumbnails/autumn%20colours-02.jpeg"
                 alt="Autumn colours 02"
                 loading="lazy">

            <span class="photo-caption">Autumn colours 02</span>

        </a>
        
        <a class="gallery-photo zoom"
           href="autumn%20colours-03.jpeg"
           data-gallery="autumn-colours"
           data-caption="Autumn colours 03">

            <img src="thumbnails/autumn%20colours-03.jpeg"
                 alt="Autumn colours 03"
                 loading="lazy">

            <span class="photo-caption">Autumn colours 03</span>

        </a>
        

        </section>

    </main>

    <script src="../../assets/js/lightbox.js"></script>
    <script>
        (function () {
            const backLink = document.getElementById("gallery-back");
            const params = new URLSearchParams(window.location.search);
            const returnTo = params.get("returnTo");
            if (!backLink || !returnTo) return;

            try {
                const target = new URL(returnTo, window.location.href);
                const current = new URL(window.location.href);
                // Only allow return destinations on the same site/protocol.
                if (target.protocol === current.protocol && target.host === current.host) {
                    backLink.href = target.href;
                    backLink.textContent = "← Back to walk";
                }
            } catch (error) {
                // Keep the default All galleries destination if the parameter is invalid.
            }
        })();
    </script>


</body>
</html>
