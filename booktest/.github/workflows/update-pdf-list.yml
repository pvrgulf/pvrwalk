name: Update PDF list

on:
  push:
    paths:
      - "booktest/pdfs/*.pdf"
      - ".github/workflows/update-pdf-list.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pdf-list:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate booktest/pdf-list.json
        shell: python
        run: |
          import json
          from pathlib import Path

          pdf_dir = Path("booktest/pdfs")
          output = Path("booktest/pdf-list.json")

          names = sorted(
              [
                  p.name
                  for p in pdf_dir.iterdir()
                  if p.is_file() and p.suffix.lower() == ".pdf"
              ],
              key=str.casefold
          )

          output.write_text(
              json.dumps(
                  names,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(f"Found {len(names)} PDF file(s).")

          for name in names:
              print(f"  {name}")

      - name: Commit updated PDF list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add booktest/pdf-list.json

          if git diff --cached --quiet; then
            echo "No change to pdf-list.json."
          else
            git commit -m "Update booktest PDF list"
            git push
          fi
