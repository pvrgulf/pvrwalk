<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Walk — PVR Walk</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
/* Generated page-turn rules */
.reader-shell > input:first-of-type:checked ~ .book-stage .page-stack .sheet {
    transform: rotateY(0deg);
}

.reader-shell > input:nth-of-type(2):checked ~ .book-stage .page-stack .sheet:nth-child(-n+1) {
    transform: rotateY(-180deg);
}

.reader-shell > input:nth-of-type(3):checked ~ .book-stage .page-stack .sheet:nth-child(-n+2) {
    transform: rotateY(-180deg);
}

.reader-shell > input:nth-of-type(4):checked ~ .book-stage .page-stack .sheet:nth-child(-n+3) {
    transform: rotateY(-180deg);
}

.reader-shell > input:nth-of-type(5):checked ~ .book-stage .page-stack .sheet:nth-child(-n+4) {
    transform: rotateY(-180deg);
}

.reader-shell > input:nth-of-type(6):checked ~ .book-stage .page-stack .sheet:nth-child(-n+5) {
    transform: rotateY(-180deg);
}

.reader-shell > input:nth-of-type(7):checked ~ .book-stage .page-stack .sheet:nth-child(-n+6) {
    transform: rotateY(-180deg);
}


.state-controls {
    display: none;
}

.reader-shell > input:nth-of-type(1):checked ~ .state-controls.state-1 { display: flex; }
.reader-shell > input:nth-of-type(2):checked ~ .state-controls.state-2 { display: flex; }
.reader-shell > input:nth-of-type(3):checked ~ .state-controls.state-3 { display: flex; }
.reader-shell > input:nth-of-type(4):checked ~ .state-controls.state-4 { display: flex; }
.reader-shell > input:nth-of-type(5):checked ~ .state-controls.state-5 { display: flex; }
.reader-shell > input:nth-of-type(6):checked ~ .state-controls.state-6 { display: flex; }
.reader-shell > input:nth-of-type(7):checked ~ .state-controls.state-7 { display: flex; }

.reader-shell > input:nth-of-type(2):checked ~ .book-stage .left-page-2 { opacity: 1; visibility: visible; transition-delay: 330ms, 0s; }
.reader-shell > input:nth-of-type(3):checked ~ .book-stage .left-page-3 { opacity: 1; visibility: visible; transition-delay: 330ms, 0s; }
.reader-shell > input:nth-of-type(4):checked ~ .book-stage .left-page-4 { opacity: 1; visibility: visible; transition-delay: 330ms, 0s; }
.reader-shell > input:nth-of-type(5):checked ~ .book-stage .left-page-5 { opacity: 1; visibility: visible; transition-delay: 330ms, 0s; }
.reader-shell > input:nth-of-type(6):checked ~ .book-stage .left-page-6 { opacity: 1; visibility: visible; transition-delay: 330ms, 0s; }
.reader-shell > input:nth-of-type(7):checked ~ .book-stage .left-page-7 { opacity: 1; visibility: visible; transition-delay: 330ms, 0s; }
    </style>
</head>
<body>
    <header class="reader-header">
        <a class="back" href="../../index.html">← Booklets</a>
        <h1 class="reader-title">Walk</h1>
        <p class="reader-subtitle">
            Click the page edge or use the controls below.
        </p>
    </header>

    <main class="reader-main">
        <div class="reader-shell">
            <input type="radio" name="page" id="page-1" checked><input type="radio" name="page" id="page-2"><input type="radio" name="page" id="page-3"><input type="radio" name="page" id="page-4"><input type="radio" name="page" id="page-5"><input type="radio" name="page" id="page-6"><input type="radio" name="page" id="page-7">

            <div class="book-stage">
                
                <div class="left-page left-page-2" aria-label="Page 1" style="z-index: 2;">
                    <img src="page-001.webp"
                         alt="Walk — page 1">
                </div>

                <div class="left-page left-page-3" aria-label="Page 2" style="z-index: 3;">
                    <img src="page-002.webp"
                         alt="Walk — page 2">
                </div>

                <div class="left-page left-page-4" aria-label="Page 3" style="z-index: 4;">
                    <img src="page-003.webp"
                         alt="Walk — page 3">
                </div>

                <div class="left-page left-page-5" aria-label="Page 4" style="z-index: 5;">
                    <img src="page-004.webp"
                         alt="Walk — page 4">
                </div>

                <div class="left-page left-page-6" aria-label="Page 5" style="z-index: 6;">
                    <img src="page-005.webp"
                         alt="Walk — page 5">
                </div>

                <div class="left-page left-page-7" aria-label="Page 6" style="z-index: 7;">
                    <img src="page-006.webp"
                         alt="Walk — page 6">
                </div>

                <div class="page-stack">
                    
            <section class="sheet" aria-label="Page 1" style="z-index: 7;">
                <img src="page-001.webp"
                     alt="Walk — page 1">
                <label class="hotspot left"
                       for="page-1"
                       aria-label="Previous page"></label>
                <label class="hotspot right"
                       for="page-2"
                       aria-label="Next page"></label>
            </section>

            <section class="sheet" aria-label="Page 2" style="z-index: 6;">
                <img src="page-002.webp"
                     alt="Walk — page 2">
                <label class="hotspot left"
                       for="page-1"
                       aria-label="Previous page"></label>
                <label class="hotspot right"
                       for="page-3"
                       aria-label="Next page"></label>
            </section>

            <section class="sheet" aria-label="Page 3" style="z-index: 5;">
                <img src="page-003.webp"
                     alt="Walk — page 3">
                <label class="hotspot left"
                       for="page-2"
                       aria-label="Previous page"></label>
                <label class="hotspot right"
                       for="page-4"
                       aria-label="Next page"></label>
            </section>

            <section class="sheet" aria-label="Page 4" style="z-index: 4;">
                <img src="page-004.webp"
                     alt="Walk — page 4">
                <label class="hotspot left"
                       for="page-3"
                       aria-label="Previous page"></label>
                <label class="hotspot right"
                       for="page-5"
                       aria-label="Next page"></label>
            </section>

            <section class="sheet" aria-label="Page 5" style="z-index: 3;">
                <img src="page-005.webp"
                     alt="Walk — page 5">
                <label class="hotspot left"
                       for="page-4"
                       aria-label="Previous page"></label>
                <label class="hotspot right"
                       for="page-6"
                       aria-label="Next page"></label>
            </section>

            <section class="sheet" aria-label="Page 6" style="z-index: 2;">
                <img src="page-006.webp"
                     alt="Walk — page 6">
                <label class="hotspot left"
                       for="page-5"
                       aria-label="Previous page"></label>
                <label class="hotspot right"
                       for="page-7"
                       aria-label="Next page"></label>
            </section>

            <section class="sheet" aria-label="Page 7" style="z-index: 1;">
                <img src="page-007.webp"
                     alt="Walk — page 7">
                <label class="hotspot left"
                       for="page-6"
                       aria-label="Previous page"></label>
                <label class="hotspot right"
                       for="page-7"
                       aria-label="Next page"></label>
            </section>

                </div>
            </div>

            
            <div class="reader-controls state-controls state-1">
                <label class="reader-control" for="page-1">
                    ← Previous
                </label>
                <span class="page-count">1 / 7</span>
                <label class="reader-control" for="page-2">
                    Next →
                </label>
                <a class="pdf-control"
                   href="walk.pdf"
                   target="_blank"
                   rel="noopener">
                    Open / Print PDF
                </a>
            </div>

            <div class="reader-controls state-controls state-2">
                <label class="reader-control" for="page-1">
                    ← Previous
                </label>
                <span class="page-count">2 / 7</span>
                <label class="reader-control" for="page-3">
                    Next →
                </label>
                <a class="pdf-control"
                   href="walk.pdf"
                   target="_blank"
                   rel="noopener">
                    Open / Print PDF
                </a>
            </div>

            <div class="reader-controls state-controls state-3">
                <label class="reader-control" for="page-2">
                    ← Previous
                </label>
                <span class="page-count">3 / 7</span>
                <label class="reader-control" for="page-4">
                    Next →
                </label>
                <a class="pdf-control"
                   href="walk.pdf"
                   target="_blank"
                   rel="noopener">
                    Open / Print PDF
                </a>
            </div>

            <div class="reader-controls state-controls state-4">
                <label class="reader-control" for="page-3">
                    ← Previous
                </label>
                <span class="page-count">4 / 7</span>
                <label class="reader-control" for="page-5">
                    Next →
                </label>
                <a class="pdf-control"
                   href="walk.pdf"
                   target="_blank"
                   rel="noopener">
                    Open / Print PDF
                </a>
            </div>

            <div class="reader-controls state-controls state-5">
                <label class="reader-control" for="page-4">
                    ← Previous
                </label>
                <span class="page-count">5 / 7</span>
                <label class="reader-control" for="page-6">
                    Next →
                </label>
                <a class="pdf-control"
                   href="walk.pdf"
                   target="_blank"
                   rel="noopener">
                    Open / Print PDF
                </a>
            </div>

            <div class="reader-controls state-controls state-6">
                <label class="reader-control" for="page-5">
                    ← Previous
                </label>
                <span class="page-count">6 / 7</span>
                <label class="reader-control" for="page-7">
                    Next →
                </label>
                <a class="pdf-control"
                   href="walk.pdf"
                   target="_blank"
                   rel="noopener">
                    Open / Print PDF
                </a>
            </div>

            <div class="reader-controls state-controls state-7">
                <label class="reader-control" for="page-6">
                    ← Previous
                </label>
                <span class="page-count">7 / 7</span>
                <label class="reader-control" for="page-7">

                </label>
                <a class="pdf-control"
                   href="walk.pdf"
                   target="_blank"
                   rel="noopener">
                    Open / Print PDF
                </a>
            </div>

        </div>

        <p class="reader-hint">
            The reader is entirely HTML and CSS. JavaScript is not required.
        </p>
    </main>
</body>
</html>
