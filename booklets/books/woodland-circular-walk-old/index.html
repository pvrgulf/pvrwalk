/* Generated desktop physical-leaf rules */
.desktop-shell .book-leaf {
    position: absolute; left: 50%; top: 0;
    width: 50%; height: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 950ms cubic-bezier(.18,.72,.18,1);
    will-change: transform;
    border-radius: 0 7px 7px 0;
    box-shadow: 10px 12px 26px rgba(0,0,0,.38);
    opacity: 0;
}
.desktop-shell .book-leaf .leaf-face {
    position: absolute; inset: 0; overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border: 1px solid rgba(80,64,35,.55);
    background: #f7f1e5;
}
.desktop-shell .book-leaf .leaf-back {
    transform: rotateY(180deg);
    border-radius: 7px 0 0 7px;
}
.desktop-shell .book-leaf img {
    display: block; width: 100%; height: 100%;
    object-fit: contain; background: #e9dfc9;
}

.desktop-shell > input:nth-of-type(1):checked ~ .desktop-stage .book-leaf.leaf-1 {
    transform: rotateY(0deg); opacity: 1; z-index: 1000;
}

.desktop-shell > input:nth-of-type(2):checked ~ .desktop-stage .book-leaf.leaf-2 {
    transform: rotateY(0deg); opacity: 1; z-index: 1000;
}

.desktop-shell > input:nth-of-type(2):checked ~ .desktop-stage .book-leaf.leaf-1 {
    transform: rotateY(-180deg); opacity: 1; z-index: 900;
}

.desktop-shell > input:nth-of-type(3):checked ~ .desktop-stage .book-leaf.leaf-3 {
    transform: rotateY(0deg); opacity: 1; z-index: 1000;
}

.desktop-shell > input:nth-of-type(3):checked ~ .desktop-stage .book-leaf.leaf-2 {
    transform: rotateY(-180deg); opacity: 1; z-index: 900;
}

.desktop-shell > input:nth-of-type(3):checked ~ .desktop-stage .book-leaf.leaf-1 {
    transform: rotateY(-180deg); opacity: 0; z-index: 1;
}

.desktop-shell > input:nth-of-type(4):checked ~ .desktop-stage .book-leaf.leaf-4 {
    transform: rotateY(0deg); opacity: 1; z-index: 1000;
}

.desktop-shell > input:nth-of-type(4):checked ~ .desktop-stage .book-leaf.leaf-3 {
    transform: rotateY(-180deg); opacity: 1; z-index: 900;
}

.desktop-shell > input:nth-of-type(4):checked ~ .desktop-stage .book-leaf.leaf-1 {
    transform: rotateY(-180deg); opacity: 0; z-index: 1;
}

.desktop-shell > input:nth-of-type(4):checked ~ .desktop-stage .book-leaf.leaf-2 {
    transform: rotateY(-180deg); opacity: 0; z-index: 1;
}

.desktop-shell > input:nth-of-type(5):checked ~ .desktop-stage .book-leaf.leaf-1 {
    transform: rotateY(-180deg); opacity: 0; z-index: 1;
}

.desktop-shell > input:nth-of-type(5):checked ~ .desktop-stage .book-leaf.leaf-2 {

}

.desktop-shell > input:nth-of-type(5):checked ~ .desktop-stage .book-leaf.leaf-3 {
    transform: rotateY(-180deg); opacity: 0; z-index: 1;
}

.desktop-shell > input:nth-of-type(5):checked ~ .desktop-stage .book-leaf.leaf-4 {
    transform: rotateY(-180deg); opacity: 1; z-index: 1000;
}
